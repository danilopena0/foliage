<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Code Evaluator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00d9ff;
        }

        .form-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #00b8d9;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .results-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        .score {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }

        .score.excellent { color: #00ff88; }
        .score.good { color: #88ff00; }
        .score.fair { color: #ffcc00; }
        .score.poor { color: #ff6600; }
        .score.bad { color: #ff0044; }

        .summary {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #aaa;
        }

        .section-title {
            font-size: 1.25rem;
            margin: 1.5rem 0 1rem;
            color: #00d9ff;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 0.5rem;
        }

        .issue {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid #ff6600;
        }

        .issue.critical { border-left-color: #ff0044; }
        .issue.high { border-left-color: #ff6600; }
        .issue.medium { border-left-color: #ffcc00; }
        .issue.low { border-left-color: #88ff00; }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .issue-category {
            background: #0f3460;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .issue-severity {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .issue-severity.critical { color: #ff0044; }
        .issue-severity.high { color: #ff6600; }
        .issue-severity.medium { color: #ffcc00; }
        .issue-severity.low { color: #88ff00; }

        .issue-line {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .issue-description {
            margin-bottom: 0.5rem;
        }

        .issue-suggestion {
            color: #00d9ff;
            font-size: 0.9rem;
        }

        .issue-fix {
            background: #0f3460;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        .strength-list, .improvement-list {
            list-style: none;
            padding: 0;
        }

        .strength-list li, .improvement-list li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .strength-list li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .improvement-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ffcc00;
        }

        .complexity {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .complexity-item {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 4px;
            flex: 1;
        }

        .complexity-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .complexity-value {
            font-family: 'Fira Code', monospace;
            color: #00d9ff;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff004433;
            border: 1px solid #ff0044;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }

        .history-link {
            text-align: center;
            margin-top: 1rem;
        }

        .history-link a {
            color: #00d9ff;
            text-decoration: none;
        }

        .history-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM Code Evaluator</h1>

        <div class="form-section">
            <form id="evaluationForm">
                <div class="form-group">
                    <label for="filename">Filename (optional)</label>
                    <input type="text" id="filename" name="filename" placeholder="e.g., main.py">
                </div>
                <div class="form-group">
                    <label for="code">Python Code</label>
                    <textarea id="code" name="code" placeholder="Paste your Python code here..." required></textarea>
                </div>
                <button type="submit" id="submitBtn">Evaluate Code</button>
            </form>
        </div>

        <div class="results-section" id="results">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing your code...</p>
            </div>

            <div id="resultsContent" style="display: none;">
                <div class="score" id="score"></div>
                <div class="summary" id="summaryText"></div>

                <div class="complexity" id="complexity"></div>

                <h3 class="section-title">Issues Found</h3>
                <div id="issues"></div>

                <h3 class="section-title">Strengths</h3>
                <ul class="strength-list" id="strengths"></ul>

                <h3 class="section-title">Areas for Improvement</h3>
                <ul class="improvement-list" id="improvements"></ul>
            </div>

            <div class="error" id="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('evaluationForm');
        const resultsSection = document.getElementById('results');
        const loading = document.getElementById('loading');
        const resultsContent = document.getElementById('resultsContent');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = document.getElementById('code').value;
            const filename = document.getElementById('filename').value || null;

            resultsSection.classList.add('visible');
            loading.style.display = 'block';
            resultsContent.style.display = 'none';
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const submitResponse = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, filename })
                });

                if (!submitResponse.ok) {
                    const error = await submitResponse.json();
                    throw new Error(error.detail || 'Evaluation failed');
                }

                const { evaluation_id } = await submitResponse.json();

                const evalResponse = await fetch(`/api/evaluation/${evaluation_id}`);
                if (!evalResponse.ok) {
                    throw new Error('Failed to retrieve evaluation results');
                }

                const result = await evalResponse.json();
                displayResults(result.evaluation);

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function displayResults(evaluation) {
            const scoreEl = document.getElementById('score');
            const score = evaluation.overall_score;
            scoreEl.textContent = score.toFixed(1);
            scoreEl.className = 'score ' + getScoreClass(score);

            document.getElementById('summaryText').textContent = evaluation.summary;

            const complexityDiv = document.getElementById('complexity');
            complexityDiv.innerHTML = '';
            if (evaluation.time_complexity || evaluation.memory_complexity) {
                if (evaluation.time_complexity) {
                    complexityDiv.innerHTML += `
                        <div class="complexity-item">
                            <div class="complexity-label">Time Complexity</div>
                            <div class="complexity-value">${evaluation.time_complexity}</div>
                        </div>
                    `;
                }
                if (evaluation.memory_complexity) {
                    complexityDiv.innerHTML += `
                        <div class="complexity-item">
                            <div class="complexity-label">Memory Complexity</div>
                            <div class="complexity-value">${evaluation.memory_complexity}</div>
                        </div>
                    `;
                }
            }

            const issuesDiv = document.getElementById('issues');
            issuesDiv.innerHTML = '';
            if (evaluation.issues.length === 0) {
                issuesDiv.innerHTML = '<p>No issues found!</p>';
            } else {
                evaluation.issues.forEach(issue => {
                    issuesDiv.innerHTML += `
                        <div class="issue ${issue.severity}">
                            <div class="issue-header">
                                <span class="issue-category">${issue.category}</span>
                                <span class="issue-severity ${issue.severity}">${issue.severity}</span>
                            </div>
                            ${issue.line_number ? `<div class="issue-line">Line ${issue.line_number}</div>` : ''}
                            <div class="issue-description">${issue.description}</div>
                            <div class="issue-suggestion">${issue.suggestion}</div>
                            ${issue.example_fix ? `<div class="issue-fix">${escapeHtml(issue.example_fix)}</div>` : ''}
                        </div>
                    `;
                });
            }

            const strengthsList = document.getElementById('strengths');
            strengthsList.innerHTML = '';
            evaluation.strengths.forEach(strength => {
                strengthsList.innerHTML += `<li>${strength}</li>`;
            });

            const improvementsList = document.getElementById('improvements');
            improvementsList.innerHTML = '';
            evaluation.improvement_areas.forEach(area => {
                improvementsList.innerHTML += `<li>${area}</li>`;
            });

            resultsContent.style.display = 'block';
        }

        function getScoreClass(score) {
            if (score >= 90) return 'excellent';
            if (score >= 75) return 'good';
            if (score >= 60) return 'fair';
            if (score >= 40) return 'poor';
            return 'bad';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>

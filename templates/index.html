<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Code Evaluator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00d9ff;
        }

        .form-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #00b8d9;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        button.secondary {
            background: #e94560;
        }

        button.secondary:hover {
            background: #c73e54;
        }

        .results-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        /* Comparison layout */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        .provider-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #0f3460;
        }

        .provider-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .provider-name.huggingface { color: #ffcc00; }
        .provider-name.perplexity { color: #00d9ff; }

        .provider-time {
            font-size: 0.85rem;
            color: #888;
        }

        .provider-error {
            background: #ff004433;
            border: 1px solid #ff0044;
            padding: 1rem;
            border-radius: 4px;
            color: #ff6666;
        }

        .score {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }

        .score.excellent { color: #00ff88; }
        .score.good { color: #88ff00; }
        .score.fair { color: #ffcc00; }
        .score.poor { color: #ff6600; }
        .score.bad { color: #ff0044; }

        .summary {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #aaa;
        }

        .section-title {
            font-size: 1.1rem;
            margin: 1.25rem 0 0.75rem;
            color: #00d9ff;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 0.5rem;
        }

        .issue {
            background: #16213e;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            border-left: 4px solid #ff6600;
            font-size: 0.9rem;
        }

        .issue.critical { border-left-color: #ff0044; }
        .issue.high { border-left-color: #ff6600; }
        .issue.medium { border-left-color: #ffcc00; }
        .issue.low { border-left-color: #88ff00; }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .issue-category {
            background: #0f3460;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .issue-severity {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .issue-severity.critical { color: #ff0044; }
        .issue-severity.high { color: #ff6600; }
        .issue-severity.medium { color: #ffcc00; }
        .issue-severity.low { color: #88ff00; }

        .issue-line {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .issue-description {
            margin-bottom: 0.25rem;
        }

        .issue-suggestion {
            color: #00d9ff;
            font-size: 0.85rem;
        }

        .issue-fix {
            background: #0f3460;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
        }

        .strength-list, .improvement-list {
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
        }

        .strength-list li, .improvement-list li {
            padding: 0.4rem 0;
            padding-left: 1.25rem;
            position: relative;
        }

        .strength-list li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .improvement-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ffcc00;
        }

        .complexity {
            display: flex;
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .complexity-item {
            background: #16213e;
            padding: 0.75rem;
            border-radius: 4px;
            flex: 1;
        }

        .complexity-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .complexity-value {
            font-family: 'Fira Code', monospace;
            color: #00d9ff;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff004433;
            border: 1px solid #ff0044;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }

        /* Single result view */
        .single-result {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM Code Evaluator</h1>

        <div class="form-section">
            <form id="evaluationForm">
                <div class="form-group">
                    <label for="filename">Filename (optional)</label>
                    <input type="text" id="filename" name="filename" placeholder="e.g., main.py">
                </div>
                <div class="form-group">
                    <label for="code">Python Code</label>
                    <textarea id="code" name="code" placeholder="Paste your Python code here..." required></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" id="submitBtn">Evaluate Code</button>
                    <button type="button" id="compareBtn" class="secondary">Compare Providers</button>
                </div>
            </form>
        </div>

        <div class="results-section" id="results">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">Analyzing your code...</p>
            </div>

            <div id="singleResult" class="single-result" style="display: none;"></div>
            <div id="comparisonResult" class="comparison-grid" style="display: none;"></div>

            <div class="error" id="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('evaluationForm');
        const resultsSection = document.getElementById('results');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const singleResult = document.getElementById('singleResult');
        const comparisonResult = document.getElementById('comparisonResult');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const compareBtn = document.getElementById('compareBtn');

        // Single evaluation
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await runEvaluation(false);
        });

        // Compare providers
        compareBtn.addEventListener('click', async () => {
            await runEvaluation(true);
        });

        async function runEvaluation(isComparison) {
            const code = document.getElementById('code').value;
            const filename = document.getElementById('filename').value || null;

            if (!code.trim()) {
                alert('Please enter some code to evaluate');
                return;
            }

            resultsSection.classList.add('visible');
            loading.style.display = 'block';
            loadingText.textContent = isComparison
                ? 'Comparing providers (this may take a moment)...'
                : 'Analyzing your code...';
            singleResult.style.display = 'none';
            comparisonResult.style.display = 'none';
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            compareBtn.disabled = true;

            try {
                if (isComparison) {
                    const response = await fetch('/api/compare', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, filename })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Comparison failed');
                    }

                    const result = await response.json();
                    displayComparison(result);
                } else {
                    const submitResponse = await fetch('/api/evaluate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, filename })
                    });

                    if (!submitResponse.ok) {
                        const error = await submitResponse.json();
                        throw new Error(error.detail || 'Evaluation failed');
                    }

                    const { evaluation_id } = await submitResponse.json();

                    const evalResponse = await fetch(`/api/evaluation/${evaluation_id}`);
                    if (!evalResponse.ok) {
                        throw new Error('Failed to retrieve evaluation results');
                    }

                    const result = await evalResponse.json();
                    displaySingleResult(result.evaluation);
                }

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                compareBtn.disabled = false;
            }
        }

        function displaySingleResult(evaluation) {
            singleResult.innerHTML = renderEvaluation(evaluation);
            singleResult.style.display = 'block';
        }

        function displayComparison(result) {
            comparisonResult.innerHTML = `
                <div class="provider-card">
                    <div class="provider-header">
                        <span class="provider-name huggingface">HuggingFace</span>
                        ${result.huggingface.response_time
                            ? `<span class="provider-time">${result.huggingface.response_time}s</span>`
                            : ''}
                    </div>
                    ${result.huggingface.error
                        ? `<div class="provider-error">${result.huggingface.error}</div>`
                        : renderEvaluation(result.huggingface.evaluation)}
                </div>
                <div class="provider-card">
                    <div class="provider-header">
                        <span class="provider-name perplexity">Perplexity</span>
                        ${result.perplexity.response_time
                            ? `<span class="provider-time">${result.perplexity.response_time}s</span>`
                            : ''}
                    </div>
                    ${result.perplexity.error
                        ? `<div class="provider-error">${result.perplexity.error}</div>`
                        : renderEvaluation(result.perplexity.evaluation)}
                </div>
            `;
            comparisonResult.style.display = 'grid';
        }

        function renderEvaluation(evaluation) {
            if (!evaluation) return '<div class="provider-error">No evaluation data</div>';

            const score = evaluation.overall_score;
            const scoreClass = getScoreClass(score);

            let html = `
                <div class="score ${scoreClass}">${score.toFixed(1)}</div>
                <div class="summary">${evaluation.summary}</div>
            `;

            // Complexity
            if (evaluation.time_complexity || evaluation.memory_complexity) {
                html += '<div class="complexity">';
                if (evaluation.time_complexity) {
                    html += `
                        <div class="complexity-item">
                            <div class="complexity-label">Time</div>
                            <div class="complexity-value">${evaluation.time_complexity}</div>
                        </div>
                    `;
                }
                if (evaluation.memory_complexity) {
                    html += `
                        <div class="complexity-item">
                            <div class="complexity-label">Memory</div>
                            <div class="complexity-value">${evaluation.memory_complexity}</div>
                        </div>
                    `;
                }
                html += '</div>';
            }

            // Issues
            html += '<h3 class="section-title">Issues</h3>';
            if (evaluation.issues.length === 0) {
                html += '<p>No issues found!</p>';
            } else {
                evaluation.issues.forEach(issue => {
                    html += `
                        <div class="issue ${issue.severity}">
                            <div class="issue-header">
                                <span class="issue-category">${issue.category}</span>
                                <span class="issue-severity ${issue.severity}">${issue.severity}</span>
                            </div>
                            ${issue.line_number ? `<div class="issue-line">Line ${issue.line_number}</div>` : ''}
                            <div class="issue-description">${escapeHtml(issue.description)}</div>
                            <div class="issue-suggestion">${escapeHtml(issue.suggestion)}</div>
                            ${issue.example_fix ? `<div class="issue-fix">${escapeHtml(issue.example_fix)}</div>` : ''}
                        </div>
                    `;
                });
            }

            // Strengths
            html += '<h3 class="section-title">Strengths</h3><ul class="strength-list">';
            evaluation.strengths.forEach(s => {
                html += `<li>${escapeHtml(s)}</li>`;
            });
            html += '</ul>';

            // Improvements
            html += '<h3 class="section-title">Improvements</h3><ul class="improvement-list">';
            evaluation.improvement_areas.forEach(a => {
                html += `<li>${escapeHtml(a)}</li>`;
            });
            html += '</ul>';

            return html;
        }

        function getScoreClass(score) {
            if (score >= 90) return 'excellent';
            if (score >= 75) return 'good';
            if (score >= 60) return 'fair';
            if (score >= 40) return 'poor';
            return 'bad';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>

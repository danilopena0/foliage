<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Code Evaluator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00d9ff;
        }

        .form-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #00b8d9;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        button.secondary {
            background: #e94560;
        }

        button.secondary:hover {
            background: #c73e54;
        }

        .results-section {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        /* Comparison layout */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .comparison-grid {
                grid-template-columns: 1fr;
            }
        }

        .provider-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #0f3460;
        }

        .provider-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .provider-name.huggingface { color: #ffcc00; }
        .provider-name.perplexity { color: #00d9ff; }

        .provider-time {
            font-size: 0.85rem;
            color: #888;
        }

        .provider-error {
            background: #ff004433;
            border: 1px solid #ff0044;
            padding: 1rem;
            border-radius: 4px;
            color: #ff6666;
        }

        .score {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }

        .score.excellent { color: #00ff88; }
        .score.good { color: #88ff00; }
        .score.fair { color: #ffcc00; }
        .score.poor { color: #ff6600; }
        .score.bad { color: #ff0044; }

        .summary {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #aaa;
        }

        .section-title {
            font-size: 1.1rem;
            margin: 1.25rem 0 0.75rem;
            color: #00d9ff;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 0.5rem;
        }

        .issue {
            background: #16213e;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            border-left: 4px solid #ff6600;
            font-size: 0.9rem;
        }

        .issue.critical { border-left-color: #ff0044; }
        .issue.high { border-left-color: #ff6600; }
        .issue.medium { border-left-color: #ffcc00; }
        .issue.low { border-left-color: #88ff00; }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .issue-category {
            background: #0f3460;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .issue-severity {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .issue-severity.critical { color: #ff0044; }
        .issue-severity.high { color: #ff6600; }
        .issue-severity.medium { color: #ffcc00; }
        .issue-severity.low { color: #88ff00; }

        .issue-line {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .issue-description {
            margin-bottom: 0.25rem;
        }

        .issue-suggestion {
            color: #00d9ff;
            font-size: 0.85rem;
        }

        .issue-fix {
            background: #0f3460;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
        }

        .strength-list, .improvement-list {
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
        }

        .strength-list li, .improvement-list li {
            padding: 0.4rem 0;
            padding-left: 1.25rem;
            position: relative;
        }

        .strength-list li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #00ff88;
        }

        .improvement-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ffcc00;
        }

        .complexity {
            display: flex;
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .complexity-item {
            background: #16213e;
            padding: 0.75rem;
            border-radius: 4px;
            flex: 1;
        }

        .complexity-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .complexity-value {
            font-family: 'Fira Code', monospace;
            color: #00d9ff;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff004433;
            border: 1px solid #ff0044;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
        }

        /* Single result view */
        .single-result {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Model selector */
        .model-selector {
            margin-bottom: 1.5rem;
        }

        .model-selector label {
            margin-bottom: 0.75rem;
        }

        .model-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .model-checkbox {
            display: flex;
            align-items: center;
            background: #1a1a2e;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #0f3460;
            transition: all 0.2s;
        }

        .model-checkbox:hover {
            border-color: #00d9ff;
        }

        .model-checkbox.selected {
            border-color: #00d9ff;
            background: #0f3460;
        }

        .model-checkbox input {
            margin-right: 0.5rem;
            accent-color: #00d9ff;
        }

        .model-checkbox .model-name {
            font-size: 0.85rem;
            color: #eee;
        }

        .model-count {
            font-size: 0.8rem;
            color: #888;
            margin-top: 0.5rem;
        }

        .model-count.valid { color: #00ff88; }
        .model-count.invalid { color: #ff6600; }

        button.tertiary {
            background: #9b59b6;
        }

        button.tertiary:hover {
            background: #8e44ad;
        }

        /* Dynamic comparison grid for multi-model */
        .multi-model-grid {
            display: grid;
            gap: 1.5rem;
        }

        .multi-model-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .multi-model-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .multi-model-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

        @media (max-width: 1200px) {
            .multi-model-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
            .multi-model-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .multi-model-grid { grid-template-columns: 1fr !important; }
        }

        .model-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .model-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #0f3460;
        }

        .model-name-display {
            font-size: 0.85rem;
            color: #9b59b6;
            font-weight: 600;
            word-break: break-all;
        }

        .model-time {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM Code Evaluator</h1>

        <div class="form-section">
            <form id="evaluationForm">
                <div class="form-group">
                    <label for="filename">Filename (optional)</label>
                    <input type="text" id="filename" name="filename" placeholder="e.g., main.py">
                </div>
                <div class="form-group">
                    <label for="code">Python Code</label>
                    <textarea id="code" name="code" placeholder="Paste your Python code here..." required></textarea>
                </div>
                <div class="form-group model-selector">
                    <label>Select HuggingFace Models to Compare (2-4)</label>
                    <div class="model-checkboxes" id="modelCheckboxes">
                        <!-- Models loaded dynamically -->
                    </div>
                    <div class="model-count" id="modelCount">Select 2-4 models</div>
                </div>
                <div class="button-group">
                    <button type="submit" id="submitBtn">Evaluate Code</button>
                    <button type="button" id="compareBtn" class="secondary">Compare Providers</button>
                    <button type="button" id="compareModelsBtn" class="tertiary" disabled>Compare Models</button>
                </div>
            </form>
        </div>

        <div class="results-section" id="results">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">Analyzing your code...</p>
            </div>

            <div id="singleResult" class="single-result" style="display: none;"></div>
            <div id="comparisonResult" class="comparison-grid" style="display: none;"></div>
            <div id="multiModelResult" class="multi-model-grid" style="display: none;"></div>

            <div class="error" id="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('evaluationForm');
        const resultsSection = document.getElementById('results');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const singleResult = document.getElementById('singleResult');
        const comparisonResult = document.getElementById('comparisonResult');
        const multiModelResult = document.getElementById('multiModelResult');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const compareBtn = document.getElementById('compareBtn');
        const compareModelsBtn = document.getElementById('compareModelsBtn');
        const modelCheckboxes = document.getElementById('modelCheckboxes');
        const modelCountDiv = document.getElementById('modelCount');

        let availableModels = [];

        // Load available models on page load
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                const data = await response.json();
                availableModels = data.models;
                renderModelCheckboxes();
            } catch (err) {
                console.error('Failed to load models:', err);
                modelCheckboxes.innerHTML = '<p style="color: #ff6666;">Failed to load models</p>';
            }
        }

        function renderModelCheckboxes() {
            modelCheckboxes.innerHTML = availableModels.map((model, i) => `
                <label class="model-checkbox ${i < 2 ? 'selected' : ''}" data-model="${model}">
                    <input type="checkbox" name="model" value="${model}" ${i < 2 ? 'checked' : ''}>
                    <span class="model-name">${getShortModelName(model)}</span>
                </label>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.model-checkbox').forEach(label => {
                label.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = label.querySelector('input');
                        checkbox.checked = !checkbox.checked;
                    }
                    label.classList.toggle('selected', label.querySelector('input').checked);
                    updateModelCount();
                });
            });

            updateModelCount();
        }

        function getShortModelName(model) {
            // Extract just the model name without org
            const parts = model.split('/');
            return parts.length > 1 ? parts[1] : model;
        }

        function getSelectedModels() {
            return Array.from(document.querySelectorAll('.model-checkbox input:checked'))
                .map(cb => cb.value);
        }

        function updateModelCount() {
            const selected = getSelectedModels().length;
            const isValid = selected >= 2 && selected <= 4;
            modelCountDiv.textContent = `${selected} model${selected !== 1 ? 's' : ''} selected${isValid ? '' : ' (need 2-4)'}`;
            modelCountDiv.className = `model-count ${isValid ? 'valid' : 'invalid'}`;
            compareModelsBtn.disabled = !isValid;
        }

        // Load models on page load
        loadModels();

        // Single evaluation
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await runEvaluation('single');
        });

        // Compare providers (HF vs Perplexity)
        compareBtn.addEventListener('click', async () => {
            await runEvaluation('providers');
        });

        // Compare HuggingFace models
        compareModelsBtn.addEventListener('click', async () => {
            await runEvaluation('models');
        });

        async function runEvaluation(mode) {
            const code = document.getElementById('code').value;
            const filename = document.getElementById('filename').value || null;

            if (!code.trim()) {
                alert('Please enter some code to evaluate');
                return;
            }

            resultsSection.classList.add('visible');
            loading.style.display = 'block';
            singleResult.style.display = 'none';
            comparisonResult.style.display = 'none';
            multiModelResult.style.display = 'none';
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            compareBtn.disabled = true;
            compareModelsBtn.disabled = true;

            if (mode === 'single') {
                loadingText.textContent = 'Analyzing your code...';
            } else if (mode === 'providers') {
                loadingText.textContent = 'Comparing providers (this may take a moment)...';
            } else {
                const modelCount = getSelectedModels().length;
                loadingText.textContent = `Comparing ${modelCount} models (this may take a while)...`;
            }

            try {
                if (mode === 'models') {
                    const models = getSelectedModels();
                    const response = await fetch('/api/compare-models', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, filename, models })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Model comparison failed');
                    }

                    const result = await response.json();
                    displayMultiModelComparison(result);
                } else if (mode === 'providers') {
                    const response = await fetch('/api/compare', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, filename })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Comparison failed');
                    }

                    const result = await response.json();
                    displayComparison(result);
                } else {
                    const submitResponse = await fetch('/api/evaluate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, filename })
                    });

                    if (!submitResponse.ok) {
                        const error = await submitResponse.json();
                        throw new Error(error.detail || 'Evaluation failed');
                    }

                    const { evaluation_id } = await submitResponse.json();

                    const evalResponse = await fetch(`/api/evaluation/${evaluation_id}`);
                    if (!evalResponse.ok) {
                        throw new Error('Failed to retrieve evaluation results');
                    }

                    const result = await evalResponse.json();
                    displaySingleResult(result.evaluation);
                }

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                compareBtn.disabled = false;
                updateModelCount(); // Re-enable compare models if valid
            }
        }

        function displaySingleResult(evaluation) {
            singleResult.innerHTML = renderEvaluation(evaluation);
            singleResult.style.display = 'block';
        }

        function displayComparison(result) {
            comparisonResult.innerHTML = `
                <div class="provider-card">
                    <div class="provider-header">
                        <span class="provider-name huggingface">HuggingFace</span>
                        ${result.huggingface.response_time
                            ? `<span class="provider-time">${result.huggingface.response_time}s</span>`
                            : ''}
                    </div>
                    ${result.huggingface.error
                        ? `<div class="provider-error">${result.huggingface.error}</div>`
                        : renderEvaluation(result.huggingface.evaluation)}
                </div>
                <div class="provider-card">
                    <div class="provider-header">
                        <span class="provider-name perplexity">Perplexity</span>
                        ${result.perplexity.response_time
                            ? `<span class="provider-time">${result.perplexity.response_time}s</span>`
                            : ''}
                    </div>
                    ${result.perplexity.error
                        ? `<div class="provider-error">${result.perplexity.error}</div>`
                        : renderEvaluation(result.perplexity.evaluation)}
                </div>
            `;
            comparisonResult.style.display = 'grid';
        }

        function displayMultiModelComparison(result) {
            const numModels = result.results.length;
            multiModelResult.className = `multi-model-grid cols-${numModels}`;

            multiModelResult.innerHTML = result.results.map(r => `
                <div class="model-card">
                    <div class="model-header">
                        <span class="model-name-display">${getShortModelName(r.model_name)}</span>
                        ${r.response_time
                            ? `<span class="model-time">${r.response_time}s</span>`
                            : ''}
                    </div>
                    ${r.error
                        ? `<div class="provider-error">${r.error}</div>`
                        : renderEvaluation(r.evaluation)}
                </div>
            `).join('');

            multiModelResult.style.display = 'grid';
        }

        function renderEvaluation(evaluation) {
            if (!evaluation) return '<div class="provider-error">No evaluation data</div>';

            const score = evaluation.overall_score;
            const scoreClass = getScoreClass(score);

            let html = `
                <div class="score ${scoreClass}">${score.toFixed(1)}</div>
                <div class="summary">${escapeHtml(evaluation.summary)}</div>
            `;

            // Complexity
            if (evaluation.time_complexity || evaluation.memory_complexity) {
                html += '<div class="complexity">';
                if (evaluation.time_complexity) {
                    html += `
                        <div class="complexity-item">
                            <div class="complexity-label">Time</div>
                            <div class="complexity-value">${evaluation.time_complexity}</div>
                        </div>
                    `;
                }
                if (evaluation.memory_complexity) {
                    html += `
                        <div class="complexity-item">
                            <div class="complexity-label">Memory</div>
                            <div class="complexity-value">${evaluation.memory_complexity}</div>
                        </div>
                    `;
                }
                html += '</div>';
            }

            // Issues
            html += '<h3 class="section-title">Issues</h3>';
            if (evaluation.issues.length === 0) {
                html += '<p>No issues found!</p>';
            } else {
                evaluation.issues.forEach(issue => {
                    html += `
                        <div class="issue ${issue.severity}">
                            <div class="issue-header">
                                <span class="issue-category">${issue.category}</span>
                                <span class="issue-severity ${issue.severity}">${issue.severity}</span>
                            </div>
                            ${issue.line_number ? `<div class="issue-line">Line ${issue.line_number}</div>` : ''}
                            <div class="issue-description">${escapeHtml(issue.description)}</div>
                            <div class="issue-suggestion">${escapeHtml(issue.suggestion)}</div>
                            ${issue.example_fix ? `<div class="issue-fix">${escapeHtml(issue.example_fix)}</div>` : ''}
                        </div>
                    `;
                });
            }

            // Strengths
            html += '<h3 class="section-title">Strengths</h3><ul class="strength-list">';
            evaluation.strengths.forEach(s => {
                html += `<li>${escapeHtml(s)}</li>`;
            });
            html += '</ul>';

            // Improvements
            html += '<h3 class="section-title">Improvements</h3><ul class="improvement-list">';
            evaluation.improvement_areas.forEach(a => {
                html += `<li>${escapeHtml(a)}</li>`;
            });
            html += '</ul>';

            return html;
        }

        function getScoreClass(score) {
            if (score >= 90) return 'excellent';
            if (score >= 75) return 'good';
            if (score >= 60) return 'fair';
            if (score >= 40) return 'poor';
            return 'bad';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
